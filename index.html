<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quote Generator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 25px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

h1 {
    color: #333;
    font-size: 26px;
    margin-bottom: 25px;
}

.quote-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

#quote {
    font-size: 22px;
    line-height: 1.6;
    color: #444;
    min-height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#author {
    margin-top: 15px;
    color: #764ba2;
    font-size: 15px;
    font-weight: bold;
}

button {
    margin-top: 30px;
    border: none;
    background: #764ba2;
    color: white;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

.credit {
    margin-top: 25px;
    font-size: 12px;
    color: #888;
}
</style>
</head>

<body>

<div class="container">

    <h1>DAILY MOTIVATION</h1>

    <div class="quote-icon">💬</div>

    <div id="quote">
        Believe in yourself and keep moving forward.
    </div>

    <div id="author">
        — Unknown
    </div>

    <button onclick="newQuote()">New Quote ✨</button>

    <div class="credit">
        Created by <b>Manisha Khangar</b>
    </div>

</div>

<script>

const quotes = [
    {
        text: "Believe in yourself and keep moving forward.",
        author: "Unknown"
    },
    {
        text: "Success is the result of small efforts repeated every day.",
        author: "Robert Collier"
    },
    {
        text: "Dream big, work hard, and never give up.",
        author: "Unknown"
    },
    {
        text: "Your only limit is your mind.",
        author: "Unknown"
    },
    {
        text: "Great things never come from comfort zones.",
        author: "Unknown"
    },
    {
        text: "The future depends on what you do today.",
        author: "Mahatma Gandhi"
    }
];

function newQuote() {
    const randomIndex = Math.floor(Math.random() * quotes.length);

    document.getElementById("quote").textContent =
        quotes[randomIndex].text;

    document.getElementById("author").textContent =
        "— " + quotes[randomIndex].author;
}

</script>

</body>
</html>
